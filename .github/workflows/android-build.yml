name: Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SRP Explain AI
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build official Sherpa-ONNX Android library
        run: |
          git clone --depth 1 --branch v2.0.1 https://github.com/k2-fsa/sherpa-onnx.git /tmp/sherpa-onnx
          cd /tmp/sherpa-onnx
          curl -fL --retry 3 -o sherpa-onnx-android.tar.bz2 https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.1/sherpa-onnx-v2.0.1-android.tar.bz2
          tar -xjf sherpa-onnx-android.tar.bz2
          mkdir -p android/SherpaOnnxAar/sherpa_onnx/src/main/jniLibs
          cp -R jniLibs/. android/SherpaOnnxAar/sherpa_onnx/src/main/jniLibs/
          cd android/SherpaOnnxAar
          ./gradlew --no-daemon :sherpa_onnx:assembleRelease
          mkdir -p "$GITHUB_WORKSPACE/app/libs"
          cp sherpa_onnx/build/outputs/aar/sherpa_onnx-release.aar "$GITHUB_WORKSPACE/app/libs/"

      - name: Build SRP Explain AI debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: srp-explain-ai-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
